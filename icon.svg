<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2c3e8c"/>
      <stop offset="100%" stop-color="#141c46"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff6b6b"/>
      <stop offset="100%" stop-color="#d63031"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffeaa7"/>
      <stop offset="100%" stop-color="#fdcb6e"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#55efc4"/>
      <stop offset="100%" stop-color="#00b894"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#74b9ff"/>
      <stop offset="100%" stop-color="#0984e3"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="44" y="44" width="424" height="424" rx="80" fill="#11183b" stroke="#3b52b5" stroke-width="8"/>
  <!-- 3x3 grid of colorful 3D blocks -->
  <!-- Top row: Red L-piece -->
  <g transform="translate(76, 76)">
    <rect x="0" y="0" width="112" height="112" rx="22" fill="url(#red)"/>
    <rect x="14" y="14" width="84" height="84" rx="14" fill="#ff5252" stroke="#ff9f9f" stroke-width="4"/>
  </g>
  <g transform="translate(200, 76)">
    <rect x="0" y="0" width="112" height="112" rx="22" fill="url(#red)"/>
    <rect x="14" y="14" width="84" height="84" rx="14" fill="#ff5252" stroke="#ff9f9f" stroke-width="4"/>
  </g>
  <g transform="translate(324, 76)">
    <rect x="0" y="0" width="112" height="112" rx="22" fill="url(#gold)"/>
    <rect x="14" y="14" width="84" height="84" rx="14" fill="#feca57" stroke="#fff3bf" stroke-width="4"/>
  </g>
  <!-- Middle row -->
  <g transform="translate(76, 200)">
    <rect x="0" y="0" width="112" height="112" rx="22" fill="url(#red)"/>
    <rect x="14" y="14" width="84" height="84" rx="14" fill="#ff5252" stroke="#ff9f9f" stroke-width="4"/>
  </g>
  <g transform="translate(200, 200)">
    <rect x="0" y="0" width="112" height="112" rx="22" fill="url(#green)"/>
    <rect x="14" y="14" width="84" height="84" rx="14" fill="#1dd1a1" stroke="#81ecec" stroke-width="4"/>
  </g>
  <g transform="translate(324, 200)">
    <rect x="0" y="0" width="112" height="112" rx="22" fill="url(#gold)"/>
    <rect x="14" y="14" width="84" height="84" rx="14" fill="#feca57" stroke="#fff3bf" stroke-width="4"/>
  </g>
  <!-- Bottom row -->
  <g transform="translate(76, 324)">
    <rect x="0" y="0" width="112" height="112" rx="22" fill="url(#blue)"/>
    <rect x="14" y="14" width="84" height="84" rx="14" fill="#2e86de" stroke="#a3d2ff" stroke-width="4"/>
  </g>
  <g transform="translate(200, 324)">
    <rect x="0" y="0" width="112" height="112" rx="22" fill="url(#blue)"/>
    <rect x="14" y="14" width="84" height="84" rx="14" fill="#2e86de" stroke="#a3d2ff" stroke-width="4"/>
  </g>
  <g transform="translate(324, 324)">
    <rect x="0" y="0" width="112" height="112" rx="22" fill="url(#green)"/>
    <rect x="14" y="14" width="84" height="84" rx="14" fill="#1dd1a1" stroke="#81ecec" stroke-width="4"/>
  </g>
</svg>
